<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Check Columbia Perú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: navy header band with tabs; one working column (max 1180px). Gerente = checklist de secciones; Brand Manager = grilla de tiendas → detalle por sección (referencia vs. foto actual + IA). */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#0f1b2d; --muted:#5a6778; --line:#dce2ea;
  --accent:#007db3; --accent-soft:#e2f3fb; --navy:#0093cc; --navy-ink:#ffffff;
  --ok:#1a8a55; --ok-soft:#e3f5ec; --warn:#b26b00; --warn-soft:#fdf1dc; --bad:#c43a3a; --bad-soft:#fbe7e7;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a111d; --surface:#111b2b; --ink:#e6ecf4; --muted:#93a0b2; --line:#233149;
    --accent:#3cb6ec; --accent-soft:#0f2c3d; --navy:#0084b8; --navy-ink:#ffffff;
    --ok:#4cc58a; --ok-soft:#10301f; --warn:#e8a740; --warn-soft:#33260c; --bad:#ff7a7a; --bad-soft:#3a1717;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a111d; --surface:#111b2b; --ink:#e6ecf4; --muted:#93a0b2; --line:#233149;
  --accent:#3cb6ec; --accent-soft:#0f2c3d; --navy:#0084b8; --navy-ink:#ffffff;
  --ok:#4cc58a; --ok-soft:#10301f; --warn:#e8a740; --warn-soft:#33260c; --bad:#ff7a7a; --bad-soft:#3a1717;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{background:var(--navy);color:var(--navy-ink)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 16px 0;display:flex;flex-direction:column;gap:12px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand .logo{height:34px;width:auto}
.brand .sep{width:1px;height:26px;background:rgba(255,255,255,.5)}
.brand b{font-family:var(--display);font-size:26px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.brand span{font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.monthpick{display:flex;align-items:center;gap:8px;font-size:13px}
.monthpick .mlabel{opacity:.9}
.dd{position:relative;min-width:0}
.dd-btn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;font-size:14px;font-weight:500;transition:border-color .15s,box-shadow .15s}
.dd-btn:hover{border-color:var(--accent)}
.dd.open .dd-btn{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dd-btn .lead{color:var(--accent)}
.dd-btn small{color:var(--muted);font-weight:400;font-size:13px}
.dd-val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-ph{color:var(--muted);font-weight:400}
.dd-btn .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.dd.open .dd-btn .chev{transform:rotate(180deg);color:var(--accent)}
.dd-btn[disabled]{background:var(--bg);cursor:not-allowed;opacity:.65}
.dd-btn[disabled]:hover{border-color:var(--line)}
.dd-list{position:absolute;z-index:40;top:calc(100% + 6px);left:0;min-width:100%;width:max-content;max-width:min(92vw,420px);margin:0;padding:6px;list-style:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,40,70,.18);max-height:min(340px,60vh);overflow:auto;animation:ddin .12s ease-out}
@keyframes ddin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dd-list li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:15px;outline:none}
.dd-list li .lead{color:var(--muted)}
.dd-list li small{color:var(--muted);font-size:13px;margin-left:auto;padding-left:12px}
.dd-list li .tick{color:var(--accent);visibility:hidden;margin-left:6px}
.dd-list li:not(:has(small)) .tick{margin-left:auto}
.dd-list li:hover,.dd-list li:focus{background:var(--accent-soft)}
.dd-list li[aria-selected="true"]{color:var(--accent);font-weight:600}
.dd-list li[aria-selected="true"] .lead,.dd-list li[aria-selected="true"] .tick{color:var(--accent);visibility:visible}
.dd.lg .dd-btn{padding:13px 14px;font-size:17px;border-radius:12px}
.dd.lg .dd-list{width:100%}
.dd.sm .dd-btn{padding:6px 10px;font-size:13px}
.dd.hdr .dd-btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.5);color:#fff;padding:6px 12px}
.dd.hdr .dd-btn .lead,.dd.hdr .dd-btn .chev{color:#fff}
.dd.hdr.open .dd-btn{box-shadow:0 0 0 3px rgba(255,255,255,.3);border-color:#fff}
.dd.hdr .dd-list{left:auto;right:0}
@media (prefers-reduced-motion: reduce){.dd-list{animation:none}.dd-btn .chev{transition:none}}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;color:var(--navy-ink);opacity:.8;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;font-family:var(--display);font-size:17px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
nav.tabs button[aria-current="true"]{opacity:1;border-color:#fff;font-weight:700}
nav.tabs button:hover{opacity:1}

main{max-width:1180px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.brand{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;padding:9px 16px;box-shadow:0 2px 8px rgba(0,110,160,.25)}
.btn.brand:hover{filter:brightness(1.08);border-color:var(--navy)}
.btn.brand .ic{color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding:6px 8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);letter-spacing:.02em}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.notice{padding:12px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);font-size:14px}
.notice.info{background:var(--accent-soft)}

.bar{height:8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.done i{background:var(--ok)}

.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
nav.tabs button{display:inline-flex;align-items:center;gap:8px}
.monthpick{gap:6px}
.secic{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.secic .ic{width:22px;height:22px}
.sectitle{display:flex;align-items:center;gap:10px}
.reflabel{display:flex;align-items:center;gap:5px}
.reflabel .ic{width:14px;height:14px}
.upl span .ic{width:26px;height:26px;display:block;margin:0 auto 4px}
.kpi .l{display:flex;align-items:center;gap:6px}
.kpi .kic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;margin-bottom:8px;background:var(--accent-soft);color:var(--accent)}
.kpi .kic.ok{background:var(--ok-soft);color:var(--ok)} .kpi .kic.warn{background:var(--warn-soft);color:var(--warn)} .kpi .kic.bad{background:var(--bad-soft);color:var(--bad)}
.ai h4{display:flex;align-items:center;gap:6px}
.ai h4 .ic{width:15px;height:15px}
.ai h4.f{color:var(--bad)} .ai h4.a{color:var(--accent)} .ai h4.o{color:var(--ok)}
.refsec label{display:flex;align-items:center;gap:6px}
.refsec label .ic{width:14px;height:14px}
.pickfield label .ic{color:var(--accent)}
.iconrow{display:inline-flex;align-items:center;gap:5px}
/* Store picker */
.regions{display:grid;gap:18px}
.region h3{font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pick{text-align:left;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.pick:hover{border-color:var(--accent)}
.pick strong{font-family:var(--display);font-size:20px;font-weight:600}

.picker{display:grid;gap:14px;max-width:560px;width:100%;margin:12px auto 0;padding:24px}
.steplabel{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.pickfield{display:grid;gap:6px}
.pickfield label{font-weight:600;display:flex;align-items:center;gap:8px}
.pickfield.off{opacity:.5}
.stepn{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:inline-grid;place-items:center;font-size:13px;font-family:var(--display)}
.pickfield.off .stepn{background:var(--muted)}
.bigsel{width:100%;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.bigsel:disabled{cursor:not-allowed}

/* Bloque de tienda en color del header */
.storehead{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 6px 20px rgba(0,110,160,.22)}
.storehead .muted,.storehead .small.muted{color:rgba(255,255,255,.85)}
.storehead .chip{background:rgba(255,255,255,.2);color:#fff}
.storehead .ic{color:inherit}
.storehead .bar{background:rgba(255,255,255,.25);border-color:transparent}
.storehead .bar i,.storehead .bar.done i{background:#fff}
.storehead .notice{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.storehead .btn.brand,.storehead .btn.primary{background:#fff;border-color:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(0,40,70,.2)}
.storehead .btn.brand .ic,.storehead .btn.primary .ic{color:var(--navy)}
.storehead .btn.brand:hover,.storehead .btn.primary:hover{filter:none;background:#eaf6fc}
.storehead .btn[disabled]{opacity:.7}
.storehead .score{background:#fff}
.storehead .spin{border-color:var(--navy);border-right-color:transparent}
/* Manager sections */
.storehead{display:grid;gap:12px}
.storehead h2{font-size:30px}
.secs{display:grid;gap:12px}
.sec{display:grid;grid-template-columns:1fr;gap:14px;padding:16px}
.secic{position:relative}
.secbadge{position:absolute;right:-6px;bottom:-6px;min-width:20px;height:20px;border-radius:10px;padding:0 5px;background:var(--surface);border:2px solid var(--line);color:var(--muted);font:700 11px/16px var(--body);display:grid;place-items:center}
.secbadge .ic{width:11px;height:11px;stroke-width:3}
.secic.done{background:var(--ok-soft);color:var(--ok)}
.secic.done .secbadge{background:var(--ok);border-color:var(--ok);color:#fff}
.secic.na{background:var(--bg);color:var(--muted)}
.sec.done{border-left:4px solid var(--ok)}
.secno{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;font-weight:700;background:var(--bg);border:2px solid var(--line);color:var(--muted)}
.sec.done .secno{background:var(--ok);border-color:var(--ok);color:#fff}
.sec.na .secno{background:var(--bg);border-style:dashed}
.sec h3{font-size:22px}
.secbody{display:grid;gap:10px;min-width:0}
.secgrid{display:grid;grid-template-columns:minmax(0,180px) 1fr;gap:14px;align-items:start}
.reflabel{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:104px;height:104px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--bg);cursor:zoom-in;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.ref{width:100%;max-width:180px;height:120px}
.thumb .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(10,17,29,.75);color:#fff;cursor:pointer;font-size:14px;line-height:24px;padding:0}
.upl{width:104px;height:104px;border:2px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--accent);cursor:pointer;padding:6px;font-weight:600}
.upl:hover{border-color:var(--accent);background:var(--accent-soft)}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.noref{height:120px;max-width:180px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center;padding:8px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}

/* Panel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{padding:14px 16px}
.kpi .v{font-family:var(--display);font-size:36px;font-weight:600;line-height:1}
.kpi .l{font-size:13px;color:var(--muted);margin-top:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.scard{padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;border-left:4px solid var(--line)}
.scard:hover{border-color:var(--accent);border-left-color:var(--accent)}
.scard.s-ok{border-left-color:var(--ok)} .scard.s-warn{border-left-color:var(--warn)} .scard.s-bad{border-left-color:var(--bad)}
.scard strong{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:3px;background:var(--bg);border:1px solid var(--line)}
.dots i.up{background:var(--accent)} .dots i.na{background:repeating-linear-gradient(45deg,var(--line) 0 2px,transparent 2px 5px)}
.dots i.ok{background:var(--ok);border-color:var(--ok)} .dots i.warn{background:var(--warn);border-color:var(--warn)} .dots i.bad{background:var(--bad);border-color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .dots i{width:11px;height:11px}
.score{font-family:var(--display);font-weight:700;font-size:20px;padding:2px 10px;border-radius:6px}
.score.ok{background:var(--ok-soft);color:var(--ok)} .score.warn{background:var(--warn-soft);color:var(--warn)} .score.bad{background:var(--bad-soft);color:var(--bad)}

/* Detail */
.drow{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1.4fr);gap:16px;padding:16px;align-items:start}
.drow + .drow{border-top:1px solid var(--line)}
.drow h3{font-size:20px}
.ai{grid-column:1/-1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.ai ul{margin:0;padding-left:18px}
.ai .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ai h4{margin:0 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.summary{display:grid;gap:8px;border-left:4px solid var(--accent)}
.summary ol{margin:0;padding-left:20px}

/* Refs editor */
.refsec{padding:16px;display:grid;gap:10px}
.refsec label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.refsec input[type=text],.refsec textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.refsec textarea{min-height:70px;resize:vertical}
.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.savebar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 -6px 20px rgba(0,0,0,.06)}

#lightbox{position:fixed;inset:0;background:rgba(5,10,18,.88);display:none;place-items:center;z-index:50;padding:20px;cursor:zoom-out}
#lightbox.on{display:grid}
#lightbox img{max-height:90vh;max-width:95vw;border-radius:8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;display:none;max-width:90vw}
#toast.on{display:block}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2.5s}}

@media (max-width:820px){
  .drow{grid-template-columns:1fr}
  .fieldgrid{grid-template-columns:1fr}
}
@media (max-width:520px){
  .brand .logo{height:26px}
  .brand span{font-size:16px}
  .secgrid{grid-template-columns:1fr}
  .sec{grid-template-columns:1fr}
  .secno{width:36px;height:36px;font-size:17px}
  .thumb,.upl{width:88px;height:88px}
  .storehead h2{font-size:26px}
}
</style>
</head>
<body>
<header class="top">

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function monthLabel(m){const [y,mm]=m.split("-");return MONTHS[+mm-1]+" "+y}
function storeById(id){return STORES.find(s=>s.id===id)}
function key(st,sec){return st+"__"+sec}
function pUrl(p){return p.url||("/_blob/"+p.id)}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),4200)}
function rel(iso){if(!iso)return "";const d=new Date(iso);const days=Math.floor((Date.now()-d)/864e5);if(days<=0)return "hoy";if(days===1)return "ayer";if(days<7)return "hace "+days+" días";return d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3).toLowerCase()}
function band(score){return score==null?"":score>=80?"ok":score>=60?"warn":"bad"}
const ESTADO={cumple:"Cumple",parcial:"Cumple parcialmente",no_cumple:"No cumple"};

/* ---------- Métricas ---------- */
function secState(storeId,sec){
  const d=S.photos[key(storeId,sec.id)];
  if(!d) return {state:"empty",count:0};
  if(d.na) return {state:"na",count:0,d};
  const n=(d.photos||[]).length;
  if(!n) return {state:"empty",count:0,d};
  const a=d.analysis; const stale=a?isStale(d):false;
  return {state:"up",count:n,d,score:a?a.puntaje:null,stale};
}
function isStale(d){const a=d.analysis;if(!a)return false;const ids=(d.photos||[]).map(p=>p.id).join(",");return (a.photoIds||[]).join(",")!==ids}
function storeStats(storeId){
  let done=0,photos=0,scores=[],last=null;
  for(const sec of S.sections){
    const s=secState(storeId,sec);
    if(s.state==="up"||s.state==="na") done++;
    photos+=s.count;
    if(s.score!=null) scores.push(s.score);
    if(s.d&&s.d.updatedAt&&(!last||s.d.updatedAt>last)) last=s.d.updatedAt;
  }
  const total=S.sections.length;
  const score=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):null;
  return {done,total,pct:total?Math.round(done*100/total):0,photos,score,analyzed:scores.length,last};
}

/* ---------- Render ---------- */
function render(){
  renderMonth();
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.view===S.view)));
  const app=document.getElementById("app");
  let h="";
  if(S.noDb) h+=`<div class="notice">Esta vista no puede guardar datos. Abre la app desde su enlace en claude.ai con tu sesión iniciada para subir fotos y ver el panel.</div>`;
  else if(S.slow&&S.loading) h+=`<div class="notice">Todavía no se pudo conectar con los datos. Revisa tu conexión; la página seguirá intentando.</div>`;
  if(S.view==="subir") h+=viewSubir();
  else if(S.view==="panel") h+= S.detail?viewDetail():viewPanel();
  else h+=viewRefs();
  app.innerHTML=h;
}

  if(!S.configLoaded) return `<div class="card pad muted">Cargando secciones…</div>`;
  return `<div class="card pad"><h2 style="font-size:24px">Aún no hay secciones configuradas</h2><p class="muted">La Brand Manager debe definir las secciones de tienda y sus fotos de referencia en la pestaña Referencias.</p>${canEdit?`<button class="btn primary" data-act="go" data-v="referencias">Configurar secciones</button>`:""}</div>`;
}

        ${dd("region",r,REGIONS.map(x=>({value:x,label:x,sub:STORES.filter(s=>s.region===x).length+" tiendas",icon:"map"})),"Elige una zona…",false,"lg")}</div>

    </div>`;
  }

  let h=`<div class="card pad storehead">
    <div class="row between"><div class="iconrow"><span class="chip">${ic("map")}${s.region}</span> <span class="small muted iconrow">${ic("pin")}${esc(s.city)} · ${esc(s.addr)}</span></div><button class="btn brand" data-act="unpick">${ic("swap")}Cambiar tienda</button></div>
    <h2>Columbia ${esc(s.name)}</h2>
    <div><div class="row between small"><span class="iconrow">${ic("calendar")}Fotos de <b>${monthLabel(S.month)}</b></span><span class="num"><b>${st.done}</b> de ${st.total} secciones listas</span></div>
    <div class="bar ${st.pct===100&&st.total?"done":""}" style="margin-top:6px"><i style="width:${st.pct}%"></i></div></div>
    ${st.pct===100&&st.total?`<div class="notice info iconrow" style="display:flex">${ic("checkcircle")}<span><b>¡Listo!</b> Todas las secciones de este mes están completas. Puedes reemplazar fotos si hiciste cambios en la tienda.</span></div>`:`<p class="small muted" style="margin:0">Toma una foto por sección siguiendo la referencia (mismo ángulo y encuadre). Puedes subir varias por sección.</p>`}
    ${!assets&&!S.noDb&&db?`<div class="notice">Tu acceso a esta app es de solo lectura, así que no puedes subir fotos. Pide a la Brand Manager acceso como Colaborador.</div>`:""}
  </div>`;
  if(!S.sections.length) return h+sectionsMissing();
  h+=`<div class="secs">`;
  S.sections.forEach((sec,i)=>{
    const ss=secState(s.id,sec); const k=key(s.id,sec.id); const busy=S.busy[k]||0;
    const cls=ss.state==="up"?"done":ss.state==="na"?"na":"";
    const ref=(sec.refs||[])[0];
    h+=`<article class="card sec ${cls}"><div class="secbody">
      <div class="row between"><div class="sectitle"><span class="secic ${cls}">${ic(secIcon(sec))}<b class="secbadge num">${ss.state==="up"?ic("check"):i+1}</b></span><h3>${esc(sec.name)}</h3></div>
        <label class="toggle" for="na-${esc(sec.id)}"><input type="checkbox" id="na-${esc(sec.id)}" data-act="na" data-sec="${esc(sec.id)}" ${ss.state==="na"?"checked":""} ${ss.count?"disabled":""}> ${ic("ban")} No aplica en esta tienda</label></div>
      ${sec.hint?`<p class="small muted iconrow" style="margin:0;align-items:flex-start">${ic("camera")}<span>${esc(sec.hint)}</span></p>`:""}
      ${ss.state==="na"?"":`<div class="secgrid">
        <div><div class="reflabel">${ic("checkcircle")}Así debe verse</div>${ref?`<button type="button" class="thumb ref" data-act="zoom" data-src="${esc(pUrl(ref))}"><img src="${esc(pUrl(ref))}" alt="Referencia ${esc(sec.name)}" loading="lazy"></button>`:`<div class="noref"><span>${ic("image")}<br>Sin foto de referencia todavía</span></div>`}</div>

function viewPanel(){
  if(!S.sections.length) return sectionsMissing();
  const all=STORES.map(s=>({s,st:storeStats(s.id)}));
  const complete=all.filter(x=>x.st.pct===100).length;
  const started=all.filter(x=>x.st.done>0&&x.st.pct<100).length;
  const pending=all.filter(x=>x.st.done===0);
  const photos=all.reduce((a,x)=>a+x.st.photos,0);
  const scored=all.filter(x=>x.st.score!=null);
  const avg=scored.length?Math.round(scored.reduce((a,x)=>a+x.st.score,0)/scored.length):null;
  let low=0; for(const x of all) for(const sec of S.sections){const ss=secState(x.s.id,sec); if(ss.score!=null&&ss.score<60) low++;}

  let list=all.filter(x=>S.region==="Todas"||x.s.region===S.region);
  if(S.sort==="progreso") list.sort((a,b)=>a.st.pct-b.st.pct||a.s.name.localeCompare(b.s.name));
  else if(S.sort==="puntaje") list.sort((a,b)=>(a.st.score??999)-(b.st.score??999));
  else list.sort((a,b)=>a.s.name.localeCompare(b.s.name));

  let h=`<div class="row between"><div><h2 style="font-size:30px;display:flex" class="iconrow">${ic("calendar")}${monthLabel(S.month)}</h2><span class="muted small">${STORES.length} tiendas · ${S.sections.length} secciones por tienda</span></div>
    ${pending.length||started?`<button class="btn" data-act="copyremind">${ic("copy")}Copiar recordatorio para tiendas pendientes</button>`:""}</div>

/* ---------- Imágenes ---------- */
async function shrink(blob,max,q){
  try{
    const bmp=await createImageBitmap(blob);
    const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||blob),"image/jpeg",q));
  }catch(e){return blob}
}
async function urlToBlob(u){
  try{const r=await fetch(u);if(r.ok)return await shrink(await r.blob(),1024,.8)}catch(e){}
  return await new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,1024/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error("imagen")),"image/jpeg",.8)};im.onerror=()=>rej(new Error("No se pudo leer una foto"));im.src=u});
}

/* ---------- Escrituras ---------- */
function writeSec(storeId,secId,mutate){
  const m=S.month, k=key(storeId,secId), ck=m+"/"+k;
  chains[ck]=(chains[ck]||Promise.resolve()).catch(()=>{}).then(async()=>{
    const ref=db.doc(`months/${m}/photos/${k}`);
    const snap=await ref.get();
    const cur=snap.exists?JSON.parse(JSON.stringify(snap.data())):{storeId,sectionId:secId,month:m,photos:[]};
    const next=mutate(cur); next.updatedAt=new Date().toISOString();
    await ref.set(next);
  });
  return chains[ck];
}
async function handleFiles(secId,files){
  if(!assets){toast("No tienes permiso para subir fotos.");return}
  const storeId=S.store, k=key(storeId,secId);
  S.busy[k]=(S.busy[k]||0)+files.length; render();
  for(const f of files){
    try{
      const b=await shrink(f,1600,.82);
      const r=await assets.upload(b);
      await writeSec(storeId,secId,d=>{d.photos=[...(d.photos||[]),{id:r.id,url:r.url,at:new Date().toISOString(),by:myId}];d.na=false;return d});
    }catch(e){toast("No se pudo subir "+(f.name||"la foto")+": "+(e&&(e.message||e.code)||"error"))}
    S.busy[k]--; render();
  }
}
async function delPhoto(secId,pid){
  try{
    await writeSec(S.store,secId,d=>{d.photos=(d.photos||[]).filter(p=>p.id!==pid);return d});
    try{await assets.delete(pid)}catch(e){}
  }catch(e){toast("No se pudo quitar la foto.")}
}
async function setNA(secId,val){
  try{await writeSec(S.store,secId,d=>{d.na=val;return d})}catch(e){toast("No se pudo guardar.")}
}

/* ---------- IA ---------- */
function aiError(e){
  const c=e&&e.code;
  if(c==="not_granted") toast("El análisis con IA no está habilitado para tu cuenta en esta app.");
  else if(c==="rate_limited") toast("Se alcanzó el límite de análisis. Intenta de nuevo en unos minutos.");
  else toast("El análisis falló: "+(e&&(e.message||c)||"error"));
}
async function analyzeSection(storeId,secId){
  const sec=S.sections.find(x=>x.id===secId); const store=storeById(storeId);
  const d=S.photos[key(storeId,secId)]; if(!sec||!d||!(d.photos||[]).length) return false;
  const k=key(storeId,secId); S.ai[k]=true; render();
  try{
    const refs=(sec.refs||[]).slice(0,3), phs=d.photos.slice(-5);
    const images=[]; for(const r of refs) images.push(await urlToBlob(pUrl(r))); for(const p of phs) images.push(await urlToBlob(pUrl(p)));
    const prompt=`Eres auditor/a de visual merchandising (VM) de las tiendas Columbia Sportswear en Perú.
Tienda: Columbia ${store.name} (${store.city}).
Sección: ${sec.name}.
Guía de VM de esta sección: ${sec.guideline||"(no hay guía escrita)"}
Imágenes adjuntas, en orden: ${refs.length?`las primeras ${refs.length} son la REFERENCIA aprobada (cómo debe verse la sección); las siguientes ${phs.length} son FOTOS ACTUALES de la tienda.`:`no hay foto de referencia; las ${phs.length} imágenes son FOTOS ACTUALES de la tienda. Evalúa solo contra la guía escrita.`}
Compara las fotos actuales contra la referencia y la guía. Describe solo lo que se ve en las fotos. Si algo no se puede comprobar en la foto (ángulo, luz, encuadre), ponlo en "no_verificable" en lugar de suponer. Escribe en español, en frases cortas y accionables para el gerente de tienda.
Responde únicamente con JSON con esta forma exacta:
{"puntaje": entero de 0 a 100, "estado": "cumple" | "parcial" | "no_cumple", "resumen": "1 o 2 frases", "aciertos": ["..."], "faltantes": ["qué falta o difiere respecto a la referencia"], "acciones": ["acción concreta"], "no_verificable": ["..."]}`;
    const res=await sample.json(prompt,{images,modelTier:"default",cache:false});
    const a={puntaje:Math.max(0,Math.min(100,Math.round(+res.puntaje||0))),estado:["cumple","parcial","no_cumple"].includes(res.estado)?res.estado:"parcial",resumen:String(res.resumen||""),aciertos:(res.aciertos||[]).map(String).slice(0,8),faltantes:(res.faltantes||[]).map(String).slice(0,8),acciones:(res.acciones||[]).map(String).slice(0,8),no_verificable:(res.no_verificable||[]).map(String).slice(0,6),at:new Date().toISOString(),refIds:refs.map(r=>r.id)};
    await writeSec(storeId,secId,doc=>{doc.analysis={...a,photoIds:(doc.photos||[]).map(p=>p.id)};return doc});
    return true;
  }catch(e){aiError(e);return e&&e.code==="rate_limited"?"stop":false}
  finally{delete S.ai[k];render()}
}
async function analyzeStore(storeId){
  S.aiStore=storeId; render();
  try{
    for(const sec of S.sections){
      const ss=secState(storeId,sec);
      if(ss.state==="up"&&(!ss.d.analysis||ss.stale)){const r=await analyzeSection(storeId,sec.id); if(r==="stop") return}
    }
    const store=storeById(storeId), m=S.month;
    const lines=S.sections.map(sec=>{const ss=secState(storeId,sec);const a=ss.d&&ss.d.analysis;
      if(ss.state==="na") return `- ${sec.name}: no aplica en esta tienda`;
      if(ss.state!=="up") return `- ${sec.name}: SIN FOTO este mes`;
      if(!a) return `- ${sec.name}: sin análisis`;
      return `- ${sec.name}: puntaje ${a.puntaje} (${a.estado}). Falta: ${(a.faltantes||[]).join("; ")||"nada relevante"}`;}).join("\n");
    const res=await sample.json(`Eres auditor/a de visual merchandising de Columbia Sportswear en Perú. Con estos resultados por sección de la tienda Columbia ${store.name} (${monthLabel(m)}), escribe un resumen para la Brand Manager. No agregues información que no esté en los resultados.
${lines}
Responde solo JSON: {"resumen": "2 o 3 frases sobre el estado general", "prioridades": ["las 3 acciones más importantes para este mes, en orden"]}`,{modelTier:"default",cache:false});
    const st=storeStats(storeId);
    await db.doc(`months/${m}/stores/${storeId}`).set({storeId,month:m,resumen:String(res.resumen||""),prioridades:(res.prioridades||[]).map(String).slice(0,5),puntaje:st.score,at:new Date().toISOString()});
  }catch(e){aiError(e)}
  finally{S.aiStore=null;render()}
}

function slug(s){return (s||"seccion").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30)||"seccion"}
function markDirty(){S.dirty=true;const sb=document.querySelector(".savebar");if(sb){sb.querySelector("span").textContent="Tienes cambios sin guardar.";sb.querySelector("span").classList.remove("muted");sb.querySelectorAll("button").forEach(b=>b.disabled=false)}}
async function refFiles(i,files){
  const sec=S.draft[i]; const bk="ref__"+sec.id; S.busy[bk]=true; render();
  for(const f of files){try{const b=await shrink(f,1600,.85);const r=await assets.upload(b);sec.refs=[...(sec.refs||[]),{id:r.id,url:r.url}];S.dirty=true}catch(e){toast("No se pudo subir la referencia.")}}
  delete S.busy[bk]; render();
}
async function saveCfg(){
  const clean=S.draft.map(s=>({id:s.id,name:(s.name||"").trim()||"Sección",hint:s.hint||"",guideline:s.guideline||"",refs:s.refs||[]}));
  try{await db.doc("config/main").set({sections:clean,updatedAt:new Date().toISOString()});S.dirty=false;S.draft=null;toast("Referencias guardadas.")}
  catch(e){toast("No se pudo guardar: "+(e.message||e.code))}
  render();
}

  if(a==="pick"){S.store=el.dataset.id;lsSet("vc_store",S.store);render();window.scrollTo(0,0)}
  else if(a==="unpick"){const cur=storeById(S.store);S.pickRegion=cur?cur.region:"";S.store="";render()}
  else if(a==="go") go(el.dataset.v);
  else if(a==="zoom"){const lb=document.getElementById("lightbox");lb.querySelector("img").src=el.dataset.src;lb.classList.add("on")}
  else if(a==="delphoto"){e.stopPropagation();delPhoto(el.dataset.sec,el.dataset.pid)}
  else if(a==="region"){S.region=el.dataset.r;render()}
  else if(a==="detail") go("panel",el.dataset.id);
  else if(a==="back") go("panel");
  else if(a==="analyze") analyzeSection(el.dataset.store,el.dataset.sec);
  else if(a==="analyzestore") analyzeStore(el.dataset.store);
  else if(a==="copyremind"){
    const pend=STORES.map(s=>({s,st:storeStats(s.id)})).filter(x=>x.st.pct<100);
    const txt=`Hola equipo 👋 Recordatorio: faltan las fotos de visual merchandising de ${monthLabel(S.month)}.\n\n`+pend.map(x=>`• ${x.s.name}: ${x.st.done}/${x.st.total} secciones`).join("\n")+`\n\nSúbanlas desde la app Visual Check. ¡Gracias!`;
    try{await navigator.clipboard.writeText(txt);toast("Recordatorio copiado. Pégalo en WhatsApp o correo.")}catch(err){toast("No se pudo copiar automáticamente.")}
  }
  else if(a==="seed"){S.draft=JSON.parse(JSON.stringify(SUGGESTED)).map(s=>({...s,refs:[]}));S.dirty=true;render()}
  else if(a==="addsec"){S.draft.push({id:slug("seccion")+"-"+Math.random().toString(36).slice(2,6),name:"Nueva sección",hint:"",guideline:"",refs:[]});S.dirty=true;render()}
  else if(a==="rmsec"){S.draft.splice(+el.dataset.i,1);S.dirty=true;render()}
  else if(a==="mv"){const i=+el.dataset.i,j=i+ +el.dataset.d;[S.draft[i],S.draft[j]]=[S.draft[j],S.draft[i]];S.dirty=true;render()}
  else if(a==="rmref"){e.stopPropagation();S.draft[+el.dataset.i].refs.splice(+el.dataset.j,1);S.dirty=true;render()}
  else if(a==="discard"){S.draft=null;S.dirty=false;render()}
  else if(a==="savecfg") saveCfg();
});
document.getElementById("app").addEventListener("change",e=>{
  const el=e.target; const a=el.dataset.act;
  if(a==="files"){const fs=[...el.files];el.value="";if(fs.length) handleFiles(el.dataset.sec,fs)}
  else if(a==="reffiles"){const fs=[...el.files];el.value="";if(fs.length) refFiles(+el.dataset.i,fs)}
  else if(a==="na") setNA(el.dataset.sec,el.checked);
  else if(a==="sort"){S.sort=el.value;render()}
  else if(a==="pickregion"){S.pickRegion=el.value;render();const ps=document.getElementById("pick-store");if(ps)ps.focus()}
  else if(a==="pickstore"&&el.value){S.store=el.value;lsSet("vc_store",S.store);render();window.scrollTo(0,0)}
});
document.getElementById("app").addEventListener("input",e=>{
  const el=e.target; if(el.dataset.field&&S.draft){S.draft[+el.dataset.i][el.dataset.field]=el.value;markDirty()}
});
document.getElementById("lightbox").addEventListener("click",()=>document.getElementById("lightbox").classList.remove("on"));
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("lightbox").classList.remove("on")});

const MONTH_OPTS=[];
for(let i=0;i<12;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const m=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");MONTH_OPTS.push({value:m,label:monthLabel(m),sub:i===0?"Mes actual":"",icon:"calendar"})}

/* ---------- Desplegables propios ---------- */
function dd(id,value,opts,ph,disabled,variant){
  const cur=opts.find(o=>o.value===value); const open=S.openDD===id&&!disabled;
  return `<div class="dd ${variant||""} ${open?"open":""}" data-dd="${id}">
    <button type="button" class="dd-btn" id="dd-${id}" aria-haspopup="listbox" aria-expanded="${open}" ${disabled?"disabled":""}>
      ${cur&&cur.icon?ic(cur.icon,"lead"):""}<span class="dd-val ${cur?"":"dd-ph"}">${esc(cur?cur.label:ph)}</span>${cur&&cur.sub&&variant==="lg"?`<small>${esc(cur.sub)}</small>`:""}${ic("down","chev")}
    </button>
    ${open?`<ul class="dd-list" role="listbox" aria-labelledby="dd-${id}">${opts.map((o,i)=>`<li role="option" tabindex="-1" data-val="${esc(o.value)}" aria-selected="${o.value===value}">${o.icon?ic(o.icon,"lead"):""}<span>${esc(o.label)}</span>${o.sub?`<small>${esc(o.sub)}</small>`:""}${ic("check","tick")}</li>`).join("")}</ul>`:""}
  </div>`;
}
function renderMonth(){document.getElementById("monthdd").innerHTML=dd("month",S.month,MONTH_OPTS,"",false,"hdr")}
function focusOpt(){const l=document.querySelector(".dd.open .dd-list");if(!l)return;const o=l.querySelector('[aria-selected="true"]')||l.querySelector("li");if(o){o.focus();o.scrollIntoView({block:"nearest"})}}
function pickDD(id,val){
  S.openDD=null;
  if(id==="month"){S.month=val;subMonth()}
  else if(id==="region"){S.pickRegion=val;S.openDD="store"}
  else if(id==="store"){S.store=val;lsSet("vc_store",val);window.scrollTo(0,0)}
  else if(id==="sort"){S.sort=val}
  render(); if(S.openDD) focusOpt();
  else {const b=document.getElementById("dd-"+id); if(b) b.focus()}
}
document.addEventListener("click",e=>{
  const li=e.target.closest(".dd-list li[data-val]");
  if(li){pickDD(li.closest(".dd").dataset.dd,li.dataset.val);return}
  const btn=e.target.closest(".dd-btn");
  if(btn){const id=btn.closest(".dd").dataset.dd;S.openDD=S.openDD===id?null:id;render();if(S.openDD)focusOpt();return}
  if(S.openDD&&!e.target.closest(".dd")){S.openDD=null;render()}
});
document.addEventListener("keydown",e=>{
  if(!S.openDD){ if((e.key==="ArrowDown"||e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("dd-btn")&&e.key==="ArrowDown"){e.preventDefault();S.openDD=e.target.closest(".dd").dataset.dd;render();focusOpt()} return}
  const items=[...document.querySelectorAll(".dd.open .dd-list li")]; const i=items.indexOf(document.activeElement);
  if(e.key==="Escape"){const id=S.openDD;S.openDD=null;render();const b=document.getElementById("dd-"+id);if(b)b.focus();e.preventDefault()}
  else if(e.key==="ArrowDown"){e.preventDefault();(items[i+1]||items[0]).focus()}
  else if(e.key==="ArrowUp"){e.preventDefault();(items[i-1]||items[items.length-1]).focus()}
  else if((e.key==="Enter"||e.key===" ")&&i>=0){e.preventDefault();pickDD(S.openDD,items[i].dataset.val)}
  else if(e.key==="Tab"){S.openDD=null;render()}
});

/* ---------- Datos en vivo ---------- */
function subConfig(){
  db.doc("config/main").onSnapshot(s=>{
    S.sections=s.exists?(s.data().sections||[]):[];S.configLoaded=true;
    if(!S.dirty) S.draft=null;
    S.loading=false;render();
  },()=>{S.configLoaded=true;S.loading=false;render()});
}
function subMonth(){
  if(unsubPhotos) unsubPhotos(); if(unsubStores) unsubStores();
  S.photos={};S.summaries={};
  const m=S.month;
  unsubPhotos=db.collection(`months/${m}/photos`).onSnapshot(q=>{if(m!==S.month)return;const o={};q.docs.forEach(d=>o[d.id]=d.data());S.photos=o;if(!q.metadata.fromCache)S.slow=false;render()},()=>{});
  unsubStores=db.collection(`months/${m}/stores`).onSnapshot(q=>{if(m!==S.month)return;const o={};q.docs.forEach(d=>o[d.id]=d.data());S.summaries=o;render()},()=>{});
}

fromHash();
render();
(async()=>{
  const C=window.claude;
  if(!C||!C.use){S.noDb=true;S.loading=false;render();return}
  setTimeout(()=>{if(S.loading){S.slow=true;render()}},10000);
  [db,assets,sample,user]=await Promise.all(["db","assets","sample","user"].map(n=>C.use(n).catch(()=>null)));
  if(user){try{canEdit=!!(await user.canEdit())}catch(e){} try{myId=await user.id()}catch(e){}}
  if(sample){try{const l=await sample.limits();if(l&&l.images===false) sample=null}catch(e){}}
  if(!db){S.noDb=true;S.loading=false;render();return}
  subConfig();subMonth();render();
})();
</script>
</body>
